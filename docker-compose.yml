services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - PORT=4000
      - CORS_ORIGIN=http://localhost:3000
      - AI_BATCH_SIZE=${AI_BATCH_SIZE:-15}
      - AI_BATCH_CONCURRENCY=${AI_BATCH_CONCURRENCY:-3}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend
    restart: unless-stopped
